apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@ssh.dev.azure.com:v3/veereshvmalali/ShopSphere/ShopSphere
    targetRevision: main
    path: infrastructure/kubernetes/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - Prune=false
      - CreateNamespace=true
