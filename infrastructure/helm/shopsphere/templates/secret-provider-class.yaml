apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.secretProviderClassName }}
  namespace: default
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secrets.kubernetesSecretName }}
      type: Opaque
      data:
        - objectName: shopsphere-postgres-password
          key: POSTGRES_PASSWORD
        - objectName: shopsphere-database-url
          key: DATABASE_URL
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "718f3e81-3249-4c09-b2bc-7d32fe2b2afa"
    keyvaultName: "shopsphere-kv-2026"
    tenantId: "9263e7bd-aca3-4156-8706-a9b083dbd8c5"
    objects: |
      array:
        - |
          objectName: shopsphere-postgres-password
          objectType: secret
        - |
          objectName: shopsphere-database-url
          objectType: secret
