
trigger: none
pr: none

pool:
  name: ShopSphere-Pool

variables:
  - group: ShopSphere-CI-Secrets
  - name: ACR_NAME
    value: acrshopspheredev
  - name: ACR_LOGIN_SERVER
    value: acrshopspheredev.azurecr.io
  - name: IMAGE_TAG
    value: $(Build.BuildId)

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      docker run --rm \
        --network host \
        -e SONAR_HOST_URL=http://127.0.0.1:9000 \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$(Build.SourcesDirectory):/usr/src" \
        sonarsource/sonar-scanner-cli \
        -Dsonar.projectKey=ShopSphere \
        -Dsonar.projectName=ShopSphere \
        -Dsonar.sources=services \
        -Dsonar.exclusions="**/test_*.py,**/__pycache__/**"
    displayName: 'Run SonarQube Analysis'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)

  - script: |
      set -eu
      cd "$(Build.SourcesDirectory)"
      REPORT_DIR="$(Build.ArtifactStagingDirectory)/trivy-reports"
      mkdir -p "$REPORT_DIR"
      wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
        -O "$REPORT_DIR/html.tpl"
      trivy fs \
        --scanners vuln,misconfig \
        --format template \
        --template "@$REPORT_DIR/html.tpl" \
        --output "$REPORT_DIR/trivy-fs-report.html" \
        .
    displayName: 'Run Trivy Filesystem Scan and Generate HTML Report'

  - script: |
      set -eu
      cd "$(Build.SourcesDirectory)"

      PREVIOUS="$(git rev-parse HEAD~1 2>/dev/null || true)"
      CURRENT="$(git rev-parse HEAD)"
      CHANGES="$(mktemp)"
      trap 'rm -f "$CHANGES"' EXIT

      if [ -z "$PREVIOUS" ]; then
        git ls-files > "$CHANGES"
      else
        git diff --name-only "$PREVIOUS" "$CURRENT" > "$CHANGES"
      fi

      SERVICES="product-service cart-service order-service inventory-service payment-service frontend"
      BUILD_ALL=false

      if grep -Eq '(^|/)(azure-pipelines-ci-build\.yml|services/.*/requirements\.txt|services/.*/Dockerfile|frontend/Dockerfile)$|^requirements\.txt$' "$CHANGES"; then
        BUILD_ALL=true
      fi

      if grep -Eq '^services/|^frontend/' "$CHANGES" && [ "$BUILD_ALL" = false ]; then
        :
      fi

      : > "$(Build.ArtifactStagingDirectory)/changed-images.txt"

      for service in $SERVICES; do
        case "$service" in
          frontend) PATH_PREFIX="frontend/" ;;
          *) PATH_PREFIX="services/$service/" ;;
        esac

        if [ "$BUILD_ALL" = true ] || grep -q "^$PATH_PREFIX" "$CHANGES"; then
          echo "$service" >> "$(Build.ArtifactStagingDirectory)/changed-images.txt"
        fi
      done

      if [ ! -s "$(Build.ArtifactStagingDirectory)/changed-images.txt" ]; then
        echo "No application service changes detected. No images need building."
      else
        echo "Images selected for build:"
        cat "$(Build.ArtifactStagingDirectory)/changed-images.txt"
      fi
    displayName: 'Detect Changed Services'

  - script: |
      set -eu
      az login --identity
      az acr login --name "$(ACR_NAME)"
    displayName: 'Authenticate to Azure Container Registry'
    condition: succeeded()

  - script: |
      set -eu
      cd "$(Build.SourcesDirectory)"
      while IFS= read -r service; do
        [ -n "$service" ] || continue
        case "$service" in
          frontend) CONTEXT="frontend" ;;
          *) CONTEXT="services/$service" ;;
        esac
        docker build \
          -t "$(ACR_LOGIN_SERVER)/$service:$(IMAGE_TAG)" \
          "$CONTEXT"
      done < "$(Build.ArtifactStagingDirectory)/changed-images.txt"
    displayName: 'Build Changed Docker Images'
    condition: succeeded()

  - script: |
      set -eu
      REPORT_DIR="$(Build.ArtifactStagingDirectory)/trivy-reports"
      TEMPLATE="$REPORT_DIR/html.tpl"

      while IFS= read -r service; do
        [ -n "$service" ] || continue
        IMAGE="$(ACR_LOGIN_SERVER)/$service:$(IMAGE_TAG)"

        trivy image \
          --format template \
          --template "@$TEMPLATE" \
          --output "$REPORT_DIR/trivy-image-$service.html" \
          "$IMAGE"

        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          "$IMAGE"
      done < "$(Build.ArtifactStagingDirectory)/changed-images.txt"
    displayName: 'Scan Changed Images and Generate HTML Reports'
    condition: succeeded()

  - script: |
      set -eu
      while IFS= read -r service; do
        [ -n "$service" ] || continue
        docker push "$(ACR_LOGIN_SERVER)/$service:$(IMAGE_TAG)"
      done < "$(Build.ArtifactStagingDirectory)/changed-images.txt"
    displayName: 'Push Scanned Images to ACR'
    condition: succeeded()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Trivy HTML Reports'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/trivy-reports'
      artifact: 'Trivy-HTML-Reports'
      publishLocation: 'pipeline'
    condition: always()
