
trigger: none

pool:
  name: ShopSphere-Pool

variables:
  - group: ShopSphere-CI-Secrets
  - name: ACR_NAME
    value: acrshopspheredev
  - name: ACR_LOGIN_SERVER
    value: acrshopspheredev.azurecr.io
  - name: IMAGE_TAG
    value: $(Build.BuildId)

steps:
  - checkout: self

  - script: |
      docker run --rm \
        --network host \
        -e SONAR_HOST_URL=http://127.0.0.1:9000 \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$(Build.SourcesDirectory):/usr/src" \
        sonarsource/sonar-scanner-cli \
        -Dsonar.projectKey=ShopSphere \
        -Dsonar.projectName=ShopSphere \
        -Dsonar.sources=services \
        -Dsonar.exclusions="**/test_*.py,**/__pycache__/**"
    displayName: 'Run SonarQube Analysis'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)

  - script: |
      set -eu
      cd "$(Build.SourcesDirectory)"
      mkdir -p "$(Build.ArtifactStagingDirectory)/trivy-reports"
      wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
        -O "$(Build.ArtifactStagingDirectory)/trivy-reports/html.tpl"
      trivy fs \
        --scanners vuln,misconfig \
        --format template \
        --template "@$(Build.ArtifactStagingDirectory)/trivy-reports/html.tpl" \
        --output "$(Build.ArtifactStagingDirectory)/trivy-reports/trivy-fs-report.html" \
        .
    displayName: 'Run Trivy Filesystem Scan and Generate HTML Report'

  - script: |
      set -e
      az login --identity
      az acr login --name "$(ACR_NAME)"
    displayName: 'Authenticate to Azure Container Registry'

  - script: |
      set -e
      docker build -t "$(ACR_LOGIN_SERVER)/product-service:$(IMAGE_TAG)" services/product-service
      docker build -t "$(ACR_LOGIN_SERVER)/cart-service:$(IMAGE_TAG)" services/cart-service
      docker build -t "$(ACR_LOGIN_SERVER)/order-service:$(IMAGE_TAG)" services/order-service
      docker build -t "$(ACR_LOGIN_SERVER)/inventory-service:$(IMAGE_TAG)" services/inventory-service
      docker build -t "$(ACR_LOGIN_SERVER)/payment-service:$(IMAGE_TAG)" services/payment-service
      docker build -t "$(ACR_LOGIN_SERVER)/frontend:$(IMAGE_TAG)" frontend
    displayName: 'Build All Six Docker Images'

  - script: |
      set -eu
      REPORT_DIR="$(Build.ArtifactStagingDirectory)/trivy-reports"
      TEMPLATE="$REPORT_DIR/html.tpl"

      for service in product-service cart-service order-service inventory-service payment-service frontend; do
        IMAGE="$(ACR_LOGIN_SERVER)/$service:$(IMAGE_TAG)"
        trivy image \
          --format template \
          --template "@$TEMPLATE" \
          --output "$REPORT_DIR/trivy-image-$service.html" \
          "$IMAGE"

        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          "$IMAGE"
      done
    displayName: 'Scan Docker Images and Generate HTML Reports'

  - script: |
      set -e
      docker push "$(ACR_LOGIN_SERVER)/product-service:$(IMAGE_TAG)"
      docker push "$(ACR_LOGIN_SERVER)/cart-service:$(IMAGE_TAG)"
      docker push "$(ACR_LOGIN_SERVER)/order-service:$(IMAGE_TAG)"
      docker push "$(ACR_LOGIN_SERVER)/inventory-service:$(IMAGE_TAG)"
      docker push "$(ACR_LOGIN_SERVER)/payment-service:$(IMAGE_TAG)"
      docker push "$(ACR_LOGIN_SERVER)/frontend:$(IMAGE_TAG)"
    displayName: 'Push Images to ACR'
    condition: succeeded()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Trivy HTML Reports'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/trivy-reports'
      artifact: 'Trivy-HTML-Reports'
      publishLocation: 'pipeline'
    condition: always()
