server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/products {
        proxy_pass http://product-service:8000/products;
    }

    location = /api/cart {
        proxy_pass http://cart-service:8000/cart;
    }

    location /api/cart/ {
        proxy_pass http://cart-service:8000/cart/;
    }

    location = /api/inventory {
        proxy_pass http://inventory-service:8000/inventory;
    }

    location /api/inventory/ {
        proxy_pass http://inventory-service:8000/inventory/;
    }

    location = /api/orders {
        proxy_pass http://order-service:8000/orders;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8000/orders/;
    }

    location = /api/payments {
        proxy_pass http://payment-service:8000/payments;
    }

    location /api/payments/ {
        proxy_pass http://payment-service:8000/payments/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}