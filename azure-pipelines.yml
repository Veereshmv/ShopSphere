
trigger:
  - main

pool:
  name: ShopSphere-Pool

steps:
  - checkout: self

  - script: |
      python3 --version
      docker --version
    displayName: 'Verify agent'

  - script: |
      docker rm -f shopsphere-postgres shopsphere-redis || true

      docker run -d --name shopsphere-postgres \
        -p 5432:5432 \
        -e POSTGRES_USER=ci_user \
        -e POSTGRES_PASSWORD=ci_password \
        -e POSTGRES_DB=ecommerce \
        postgres:16

      docker run -d --name shopsphere-redis \
        -p 6379:6379 \
        redis:7-alpine

      until docker exec shopsphere-postgres \
        pg_isready -U ci_user -d ecommerce; do sleep 2; done

      until docker exec shopsphere-redis redis-cli ping | grep -q PONG; do sleep 2; done
    displayName: 'Start PostgreSQL and Redis'

  - script: |
      cd services/product-service
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt pytest httpx
      export DATABASE_URL="postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/ecommerce"
      pytest -v
    displayName: 'Test product service'

  - script: |
      cd services/cart-service
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt pytest httpx
      export REDIS_URL="redis://127.0.0.1:6379/0"
      pytest -v
    displayName: 'Test cart service'

  - script: |
      cd services/inventory-service
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt pytest httpx
      export DATABASE_URL="postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/ecommerce"
      pytest -v
    displayName: 'Test inventory service'

  - script: |
      cd services/order-service
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt pytest httpx
      export DATABASE_URL="postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/ecommerce"
      pytest -v
    displayName: 'Test order service'

  - script: |
      cd services/payment-service
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt pytest httpx
      pytest -v
    displayName: 'Test payment service'

  - script: |
      docker rm -f shopsphere-postgres shopsphere-redis || true
    displayName: 'Clean up'
    condition: always()
